<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
:root { --bg:#fdfbf9; --card:#fff; --border:#f0e8e4; --text:#3a3a44; --dim:#9c96a3; --pink:#f08fb7; --pink-deep:#e56aa0; --shadow:0 6px 24px rgba(229,106,160,.08); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:"LXGW WenKai","PingFang SC","Microsoft YaHei",sans-serif; }
.wrap { max-width:760px; margin:0 auto; padding:0 24px; }
nav { position:sticky; top:14px; z-index:100; max-width:700px; margin:14px auto 0;
  background:rgba(255,255,255,.75); backdrop-filter:blur(14px);
  border:1px solid var(--border); border-radius:999px; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between; padding:8px 10px 8px 14px; }
.nav-avatar { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; }
.nav-avatar img { width:34px; height:34px; border-radius:50%; object-fit:cover; border:2px solid rgba(240,143,183,.4); filter:brightness(1.3); }
nav .links a { color:var(--dim); text-decoration:none; font-size:14px; padding:8px 11px; border-radius:999px; transition:all .2s; }
nav .links a:hover { color:var(--pink-deep); background:rgba(240,143,183,.1); }
nav .links a.on { color:var(--pink-deep); background:rgba(240,143,183,.12); }
h1.page { font-size:26px; margin:42px 0 8px; }
.sub { color:var(--dim); font-size:14px; margin-bottom:20px; }
.search {
  width:100%; margin-bottom:26px; padding:12px 18px;
  font-size:14px; font-family:inherit; color:var(--text);
  background:var(--card); border:1px solid var(--border); border-radius:999px;
  box-shadow:var(--shadow); outline:none; transition:border-color .2s;
}
.search:focus { border-color:rgba(240,143,183,.5); }
.search::placeholder { color:var(--dim); }
details.cat { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden; }
details.cat summary {
  list-style:none; padding:16px 20px;
  display:flex; align-items:center; gap:10px;
  font-size:15px; font-weight:700; user-select:none; transition:background .2s;
}
details.cat summary::-webkit-details-marker { display:none; }
details.cat summary:hover { background:rgba(240,143,183,.05); }
details.cat summary .arrow { color:var(--pink-deep); font-size:12px; transition:transform .25s; }
details.cat[open] summary .arrow { transform:rotate(90deg); }
details.cat summary .cnt { margin-left:auto; color:var(--dim); font-size:12px; font-weight:400; font-family:Consolas,monospace; }
details.cat .items { padding:4px 12px 14px; }
.post { display:flex; justify-content:space-between; align-items:center; gap:14px;
  border-radius:12px; padding:11px 14px;
  text-decoration:none; color:var(--text); transition:background .2s; }
.post:hover { background:rgba(240,143,183,.07); }
.post .t { font-size:14px; font-weight:600; }
.post .tag { font-size:11px; color:var(--pink-deep); background:rgba(240,143,183,.12); padding:2px 9px; border-radius:999px; margin-left:8px; font-weight:500; }
.post .d { color:var(--dim); font-size:12px; font-family:Consolas,monospace; white-space:nowrap; }
footer { text-align:center; padding:44px 0 36px; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
<nav>
  <div class="nav-avatar"><img src="avatar.png" alt="头像">0xL</div>
  <div class="links"><a href="index.html">首页</a><a href="notes.html">知识库</a><a href="shizhan.html">实战</a><a href="projects.html">项目</a><a href="books.html">书单</a><a href="tools.html" class="on">工具</a><a href="daily.html">日常</a></div>
</nav>

<h1 class="page">工具</h1>
<div class="sub">自用的宝贝软件存档：安装包、汉化、补丁、绝版货，附网盘链接与使用笔记。</div>
<input class="search" id="q" placeholder="搜索工具…">

<div id="cats">
  <details class="cat" open>
    <summary><span class="arrow">▶</span>逆向工具<span class="cnt">1 篇</span></summary>
    <div class="items">
      <a class="post" href="notes/tool-PowerDesigner.html"><span class="t">PowerDesigner 的安装与破解<span class="tag">汉化+补丁</span></span><span class="d">网盘</span></a>
    </div>
  </details>
</div>

<footer>© 2026 0xL · Stay curious, stay reverse.</footer>
</div>
<script>
var q = document.getElementById('q');
q.addEventListener('input', function () {
  var k = q.value.trim();
  document.querySelectorAll('.post').forEach(function (p) {
    p.style.display = !k || p.textContent.indexOf(k) !== -1 ? '' : 'none';
  });
  document.querySelectorAll('details.cat').forEach(function (c) {
    var any = false;
    c.querySelectorAll('.post').forEach(function (p) { if (p.style.display !== 'none') any = true; });
    c.style.display = any ? '' : 'none';
    if (k) c.open = true;
  });
});
</script>
</body>
</html>
