<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>日常管理 · 0xL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
:root { --bg:#fdfbf9; --card:#fff; --border:#f0e8e4; --text:#3a3a44; --dim:#9c96a3; --pink:#f08fb7; --pink-deep:#e56aa0; --shadow:0 6px 24px rgba(229,106,160,.08); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:"LXGW WenKai","PingFang SC","Microsoft YaHei",sans-serif; }
.wrap { max-width:640px; margin:0 auto; padding:36px 24px 80px; }
h1 { font-size:24px; margin-bottom:6px; }
.sub { color:var(--dim); font-size:13px; margin-bottom:24px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:22px; margin-bottom:18px; }
label { display:block; font-size:13px; color:var(--dim); margin:14px 0 6px; }
label:first-child { margin-top:0; }
input, select, textarea {
  width:100%; font-family:inherit; font-size:15px; color:var(--text);
  background:var(--bg); border:1px solid var(--border); border-radius:12px;
  padding:10px 14px; outline:none; transition:border-color .2s;
}
input:focus, select:focus, textarea:focus { border-color:rgba(240,143,183,.55); }
textarea { min-height:110px; resize:vertical; line-height:1.8; }
.row { display:flex; gap:14px; }
.row > div { flex:1; }
.btn {
  display:inline-block; border:none; border-radius:999px; cursor:pointer;
  font-family:inherit; font-size:15px; font-weight:700; padding:11px 26px; transition:all .2s;
}
.btn-pub { width:100%; margin-top:18px; padding:13px; color:#fff;
  background:linear-gradient(120deg, var(--pink), var(--pink-deep));
  box-shadow:0 8px 22px rgba(229,106,160,.35); }
.btn-pub:hover { transform:translateY(-2px); }
.btn-pub:disabled { opacity:.55; transform:none; cursor:wait; }
.btn-ghost { background:var(--bg); color:var(--dim); border:1px solid var(--border); font-size:13px; padding:6px 16px; font-weight:500; }
.btn-ghost:hover { color:var(--pink-deep); border-color:rgba(240,143,183,.5); }
.btn-danger { color:#d34f4f; }
.btn-danger:hover { color:#d34f4f; border-color:rgba(211,79,79,.5); }
.msg { margin-top:12px; font-size:14px; text-align:center; min-height:20px; }
.msg.ok { color:#3d8b5f; }
.msg.err { color:#d34f4f; }
.msg a { color:var(--pink-deep); }
.hint { font-size:12px; color:var(--dim); line-height:1.8; margin-top:8px; }
.hint a { color:var(--pink-deep); }
.back { display:inline-block; margin-bottom:16px; color:var(--pink-deep); text-decoration:none; font-size:14px; }
.back:hover { text-decoration:underline; }

.list-h { font-size:17px; font-weight:700; margin:26px 0 12px; display:flex; align-items:center; gap:10px; }
.list-h::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--pink); }
.entry { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 18px; margin-bottom:10px; box-shadow:var(--shadow); }
.entry .when { font-size:12px; color:var(--pink-deep); font-family:Consolas,monospace; font-weight:700; }
.entry .what { font-size:14px; line-height:1.8; margin:6px 0 10px; white-space:pre-wrap; }
.entry .ops { display:flex; gap:8px; }
.loading { text-align:center; color:var(--dim); padding:30px; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="daily.html">← 查看日常页</a>
<h1>日常管理</h1>
<div class="sub">新增、编辑、删除，保存后约 1 分钟全站生效。</div>

<div class="card" id="tokenBox" style="display:none">
  <label>首次使用：填入 GitHub 访问令牌（只存在你自己浏览器里）</label>
  <input type="password" id="tokenInput" placeholder="github_pat_... 或 ghp_...">
  <div class="hint">
    没有令牌？<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">点这里创建</a>：
    Repository access 选 Only select repositories → <b>xinhaowu04-collab.github.io</b>，
    Permissions → Contents 选 <b>Read and write</b>。只需设置这一次。
  </div>
  <button class="btn btn-pub" id="saveToken">保存令牌</button>
</div>

<div id="mainBox" style="display:none">
  <div class="card">
    <div id="formTitle" style="font-weight:700;margin-bottom:4px">新增日常</div>
    <div class="row">
      <div><label>日期</label><input type="date" id="fDate"></div>
      <div><label>时段</label>
        <select id="fSlot">
          <option>早</option><option>上午</option><option>中午</option>
          <option selected>下午</option><option>傍晚</option><option>晚</option><option>深夜</option>
        </select>
      </div>
    </div>
    <label>内容</label>
    <textarea id="fBody" placeholder="今天做了什么、想了什么……"></textarea>
    <button class="btn btn-pub" id="saveBtn">发布</button>
    <div style="text-align:center;margin-top:10px;display:none" id="cancelBox">
      <button class="btn btn-ghost" id="cancelBtn">取消编辑</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="list-h">全部日常（<span id="cnt">0</span> 条）</div>
  <div id="list" class="loading">加载中…</div>
</div>
</div>

<script>
var REPO = 'xinhaowu04-collab/xinhaowu04-collab.github.io';
var FILE = 'daily.md';
var token = localStorage.getItem('gh_pat') || '';
var entries = [], header = '', sha = '', editIdx = -1;
var $ = function (id) { return document.getElementById(id); };
$('fDate').value = new Date().toISOString().slice(0, 10);

function b64e(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64d(b) { return decodeURIComponent(escape(atob(b.replace(/\n/g, '')))); }

if (token) boot(); else $('tokenBox').style.display = 'block';
$('saveToken').onclick = function () {
  var t = $('tokenInput').value.trim();
  if (!t) return;
  localStorage.setItem('gh_pat', t); token = t; boot();
};

function parse(md) {
  var parts = md.split(/^## /m);
  header = parts[0];
  entries = parts.slice(1).map(function (b) {
    var nl = b.indexOf('\n');
    var when = b.slice(0, nl).trim();
    var body = b.slice(nl).trim();
    var m = when.match(/^(\d{4}-\d{2}-\d{2})\s*·\s*(.*)$/);
    return { date: m ? m[1] : when, slot: m ? m[2] : '', body: body };
  });
}
function serialize() {
  var out = header.replace(/\s*$/, '') + '\n\n';
  entries.forEach(function (e) {
    out += '## ' + e.date + ' · ' + e.slot + '\n' + e.body + '\n\n';
  });
  return out;
}
function render() {
  $('cnt').textContent = entries.length;
  if (!entries.length) { $('list').innerHTML = '<div class="loading">还没有日常</div>'; return; }
  $('list').innerHTML = entries.map(function (e, i) {
    var d = document.createElement('div');
    return '';
  }).join('');
  var html = '';
  entries.forEach(function (e, i) {
    var div = document.createElement('div');
    div.className = 'entry';
    var w = document.createElement('div'); w.className = 'when'; w.textContent = e.date + ' · ' + e.slot;
    var t = document.createElement('div'); t.className = 'what'; t.textContent = e.body;
    var ops = document.createElement('div'); ops.className = 'ops';
    var be = document.createElement('button'); be.className = 'btn btn-ghost'; be.textContent = '编辑';
    be.onclick = function () { startEdit(i); };
    var bd = document.createElement('button'); bd.className = 'btn btn-ghost btn-danger'; bd.textContent = '删除';
    bd.onclick = function () { del(i); };
    ops.appendChild(be); ops.appendChild(bd);
    div.appendChild(w); div.appendChild(t); div.appendChild(ops);
    $('list').appendChild(div);
  });
}
async function load() {
  $('list').textContent = '加载中…';
  var r = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + FILE + '?t=' + Date.now(), {
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }
  });
  if (r.status === 401) { localStorage.removeItem('gh_pat'); location.reload(); return; }
  var data = await r.json();
  sha = data.sha;
  parse(b64d(data.content));
  $('list').innerHTML = '';
  render();
}
function boot() {
  $('tokenBox').style.display = 'none';
  $('mainBox').style.display = 'block';
  load();
}
function startEdit(i) {
  editIdx = i;
  var e = entries[i];
  $('fDate').value = e.date;
  $('fSlot').value = e.slot || '下午';
  $('fBody').value = e.body;
  $('formTitle').textContent = '编辑日常（' + e.date + '）';
  $('saveBtn').textContent = '保存修改';
  $('cancelBox').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('cancelBtn').onclick = function () {
  editIdx = -1;
  $('fBody').value = '';
  $('formTitle').textContent = '新增日常';
  $('saveBtn').textContent = '发布';
  $('cancelBox').style.display = 'none';
};
function del(i) {
  if (!confirm('确定删除这条「' + entries[i].date + ' ' + entries[i].slot + '」的日常？')) return;
  entries.splice(i, 1);
  commit('daily: 删除 ' + entries.length + ' 条中的一条');
}
async function commit(cmsg) {
  var msg = $('msg'), btn = $('saveBtn');
  btn.disabled = true; btn.textContent = '保存中…';
  msg.className = 'msg'; msg.textContent = '';
  try {
    var put = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + FILE, {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: cmsg, content: b64e(serialize()), sha: sha })
    });
    if (!put.ok) throw new Error('提交失败：' + put.status);
    var nd = await put.json();
    sha = nd.content.sha;
    msg.className = 'msg ok';
    msg.innerHTML = '已保存！约 1 分钟后可见 → <a href="daily.html">查看日常页</a>';
    $('cancelBtn').click();
    $('list').innerHTML = '';
    render();
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = e.message || '出错了';
    load();
  }
  btn.disabled = false; btn.textContent = editIdx === -1 ? '发布' : '保存修改';
}
$('saveBtn').onclick = function () {
  var date = $('fDate').value, slot = $('fSlot').value, body = $('fBody').value.trim();
  var msg = $('msg');
  if (!date || !body) { msg.className = 'msg err'; msg.textContent = '日期和内容都要填'; return; }
  if (editIdx === -1) {
    entries.unshift({ date: date, slot: slot, body: body });
    commit('daily: 新增 ' + date + ' ' + slot);
  } else {
    entries[editIdx] = { date: date, slot: slot, body: body };
    commit('daily: 编辑 ' + date);
  }
};
</script>
</body>
</html>
