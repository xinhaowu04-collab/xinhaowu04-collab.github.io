<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>后台管理 · 0xL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
:root { --bg:#fdfbf9; --card:#fff; --border:#f0e8e4; --text:#3a3a44; --dim:#9c96a3; --pink:#f08fb7; --pink-deep:#e56aa0; --shadow:0 6px 24px rgba(229,106,160,.08); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:"LXGW WenKai","PingFang SC","Microsoft YaHei",sans-serif; }
.wrap { max-width:680px; margin:0 auto; padding:36px 24px 80px; }
h1 { font-size:24px; margin-bottom:6px; }
.sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:22px; margin-bottom:18px; }
label { display:block; font-size:13px; color:var(--dim); margin:12px 0 6px; }
label:first-child { margin-top:0; }
input, select, textarea { width:100%; font-family:inherit; font-size:15px; color:var(--text);
  background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:10px 14px; outline:none; }
input:focus, select:focus, textarea:focus { border-color:rgba(240,143,183,.55); }
textarea { min-height:100px; resize:vertical; line-height:1.8; }
textarea.big { min-height:200px; font-size:13.5px; font-family:Consolas,"LXGW WenKai",monospace; }
.row { display:flex; gap:12px; } .row > div { flex:1; }
.btn { display:inline-block; border:none; border-radius:999px; cursor:pointer; font-family:inherit; font-size:15px; font-weight:700; padding:11px 26px; transition:all .2s; }
.btn-pub { width:100%; margin-top:16px; padding:13px; color:#fff; background:linear-gradient(120deg, var(--pink), var(--pink-deep)); box-shadow:0 8px 22px rgba(229,106,160,.35); }
.btn-pub:disabled { opacity:.55; cursor:wait; }
.btn-ghost { background:var(--bg); color:var(--dim); border:1px solid var(--border); font-size:13px; padding:6px 16px; font-weight:500; }
.btn-ghost:hover { color:var(--pink-deep); border-color:rgba(240,143,183,.5); }
.btn-danger { color:#d34f4f; } .btn-danger:hover { color:#d34f4f; border-color:rgba(211,79,79,.5); }
.msg { margin-top:12px; font-size:14px; text-align:center; min-height:20px; }
.msg.ok { color:#3d8b5f; } .msg.err { color:#d34f4f; }
.msg a { color:var(--pink-deep); }
.hint { font-size:12px; color:var(--dim); line-height:1.8; margin-top:8px; }
.hint a { color:var(--pink-deep); }
.back { display:inline-block; margin-bottom:16px; color:var(--pink-deep); text-decoration:none; font-size:14px; }
.back:hover { text-decoration:underline; }
.tabs { display:flex; gap:8px; margin-bottom:18px; }
.tab { flex:1; text-align:center; padding:10px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--dim); font-size:14px; font-weight:600; cursor:pointer; transition:all .2s; }
.tab.on { color:var(--pink-deep); background:rgba(240,143,183,.12); border-color:rgba(240,143,183,.45); }
.pane { display:none; } .pane.on { display:block; }
.list-h { font-size:16px; font-weight:700; margin:24px 0 10px; display:flex; align-items:center; gap:10px; }
.list-h::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--pink); }
.entry { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:13px 16px; margin-bottom:10px; box-shadow:var(--shadow); }
.entry .k { font-size:12px; color:var(--pink-deep); font-family:Consolas,monospace; font-weight:700; }
.entry .v { font-size:14px; line-height:1.7; margin:5px 0 9px; white-space:pre-wrap; word-break:break-all; }
.entry .ops { display:flex; gap:8px; }
.loading { text-align:center; color:var(--dim); padding:26px; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← 返回网站</a>
<h1>后台管理</h1>
<div class="sub">日常 / 书单 / 工具，保存后约 1 分钟全站生效。</div>

<div class="card" id="tokenBox" style="display:none">
  <label>首次使用：填入 GitHub 访问令牌（只存在你自己浏览器里）</label>
  <input type="password" id="tokenInput" placeholder="github_pat_...">
  <div class="hint">没有令牌？<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">点这里创建</a>：Only select repositories → <b>xinhaowu04-collab.github.io</b>，Permissions → Contents 选 <b>Read and write</b>。</div>
  <button class="btn btn-pub" id="saveToken">保存令牌</button>
</div>

<div id="mainBox" style="display:none">
  <div class="tabs">
    <div class="tab on" data-p="daily">日常</div>
    <div class="tab" data-p="books">书单</div>
    <div class="tab" data-p="tools">工具</div>
  </div>

  <!-- ═══ 日常 ═══ -->
  <div class="pane on" id="p-daily">
    <div class="card">
      <div id="dFormTitle" style="font-weight:700;margin-bottom:4px">新增日常</div>
      <div class="row">
        <div><label>日期</label><input type="date" id="dDate"></div>
        <div><label>时段</label><select id="dSlot"><option>早</option><option>上午</option><option>中午</option><option selected>下午</option><option>傍晚</option><option>晚</option><option>深夜</option></select></div>
      </div>
      <label>内容</label>
      <textarea id="dBody" placeholder="今天做了什么、想了什么……"></textarea>
      <button class="btn btn-pub" id="dSave">发布</button>
      <div style="text-align:center;margin-top:10px;display:none" id="dCancelBox"><button class="btn btn-ghost" id="dCancel">取消编辑</button></div>
    </div>
    <div class="list-h">全部日常（<span id="dCnt">0</span>）</div>
    <div id="dList" class="loading">加载中…</div>
  </div>

  <!-- ═══ 书单 ═══ -->
  <div class="pane" id="p-books">
    <div class="card">
      <div id="bFormTitle" style="font-weight:700;margin-bottom:4px">新增书籍</div>
      <label>书名</label><input id="bTitle" placeholder="不含书名号">
      <div class="row">
        <div><label>阶段</label><select id="bStage"></select></div>
        <div><label>状态</label><select id="bStatus"><option value="todo">待读</option><option value="reading">在读</option><option value="done">已读</option><option value="free">免费在线</option></select></div>
      </div>
      <label>作者/备注</label><input id="bAuthor" placeholder="王清 · 国内漏洞启蒙经典">
      <label>链接（可选，免费资源填）</label><input id="bLink" placeholder="https://…">
      <button class="btn btn-pub" id="bSave">保存</button>
      <div style="text-align:center;margin-top:10px;display:none" id="bCancelBox"><button class="btn btn-ghost" id="bCancel">取消编辑</button></div>
    </div>
    <div class="list-h">全部书籍（<span id="bCnt">0</span>）</div>
    <div id="bList" class="loading">加载中…</div>
  </div>

  <!-- ═══ 工具 ═══ -->
  <div class="pane" id="p-tools">
    <div class="card">
      <div id="tFormTitle" style="font-weight:700;margin-bottom:4px">新增工具帖</div>
      <label>标题</label><input id="tTitle" placeholder="XX 的安装与破解">
      <div class="row">
        <div><label>分类</label><input id="tCat" placeholder="逆向工具" list="catList"><datalist id="catList"><option>逆向工具</option><option>系统工具</option><option>网络工具</option><option>汉化补丁</option><option>绝版收藏</option></datalist></div>
        <div><label>标签</label><input id="tTag" placeholder="汉化+补丁（可空）"></div>
      </div>
      <label>正文（Markdown：网盘链接、提取码、步骤……）</label>
      <textarea id="tBody" class="big" placeholder="## 下载&#10;- 链接：https://pan.baidu.com/…&#10;- 提取码：xxxx&#10;&#10;## 安装步骤&#10;……"></textarea>
      <button class="btn btn-pub" id="tSave">保存</button>
      <div style="text-align:center;margin-top:10px;display:none" id="tCancelBox"><button class="btn btn-ghost" id="tCancel">取消编辑</button></div>
    </div>
    <div class="list-h">全部工具帖（<span id="tCnt">0</span>）</div>
    <div id="tList" class="loading">加载中…</div>
  </div>

  <div class="msg" id="msg"></div>
</div>
</div>

<script>
var REPO = 'xinhaowu04-collab/xinhaowu04-collab.github.io';
var token = localStorage.getItem('gh_pat') || '';
var $ = function (id) { return document.getElementById(id); };
function b64e(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64d(b) { return decodeURIComponent(escape(atob(b.replace(/\n/g, '')))); }
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function ok(t) { $('msg').className = 'msg ok'; $('msg').innerHTML = t; }
function err(t) { $('msg').className = 'msg err'; $('msg').textContent = t; }

async function ghGet(file) {
  var r = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + file + '?t=' + Date.now(), {
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }
  });
  if (r.status === 401) { localStorage.removeItem('gh_pat'); location.reload(); throw new Error('401'); }
  var d = await r.json();
  return { sha: d.sha, text: b64d(d.content) };
}
async function ghPut(file, sha, text, cmsg) {
  var r = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + file, {
    method: 'PUT',
    headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: cmsg, content: b64e(text), sha: sha })
  });
  if (!r.ok) throw new Error('提交失败：' + r.status);
  return (await r.json()).content.sha;
}

/* ═══════ 通用标签切换 ═══════ */
document.querySelectorAll('.tab').forEach(function (t) {
  t.onclick = function () {
    document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); });
    document.querySelectorAll('.pane').forEach(function (x) { x.classList.remove('on'); });
    t.classList.add('on');
    $('p-' + t.dataset.p).classList.add('on');
    $('msg').textContent = '';
  };
});

/* ═══════ 日常 ═══════ */
var D = { sha: '', header: '', entries: [], edit: -1 };
$('dDate').value = new Date().toISOString().slice(0, 10);
function dRender() {
  $('dCnt').textContent = D.entries.length;
  $('dList').innerHTML = '';
  if (!D.entries.length) { $('dList').innerHTML = '<div class="loading">还没有日常</div>'; return; }
  D.entries.forEach(function (e, i) {
    var div = document.createElement('div'); div.className = 'entry';
    div.innerHTML = '<div class="k"></div><div class="v"></div><div class="ops"></div>';
    div.querySelector('.k').textContent = e.date + ' · ' + e.slot;
    div.querySelector('.v').textContent = e.body;
    var be = document.createElement('button'); be.className = 'btn btn-ghost'; be.textContent = '编辑';
    be.onclick = function () {
      D.edit = i; $('dDate').value = e.date; $('dSlot').value = e.slot || '下午'; $('dBody').value = e.body;
      $('dFormTitle').textContent = '编辑日常'; $('dSave').textContent = '保存修改'; $('dCancelBox').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    var bd = document.createElement('button'); bd.className = 'btn btn-ghost btn-danger'; bd.textContent = '删除';
    bd.onclick = async function () {
      if (!confirm('删除这条「' + e.date + '」的日常？')) return;
      D.entries.splice(i, 1); await dCommit('daily: 删除一条');
    };
    div.querySelector('.ops').appendChild(be); div.querySelector('.ops').appendChild(bd);
    $('dList').appendChild(div);
  });
}
function dSerialize() {
  var out = D.header.replace(/\s*$/, '') + '\n\n';
  D.entries.forEach(function (e) { out += '## ' + e.date + ' · ' + e.slot + '\n' + e.body + '\n\n'; });
  return out;
}
async function dLoad() {
  var g = await ghGet('daily.md'); D.sha = g.sha;
  var parts = g.text.split(/^## /m);
  D.header = parts[0];
  D.entries = parts.slice(1).map(function (b) {
    var nl = b.indexOf('\n'), when = b.slice(0, nl).trim(), body = b.slice(nl).trim();
    var m = when.match(/^(\d{4}-\d{2}-\d{2})\s*·\s*(.*)$/);
    return { date: m ? m[1] : when, slot: m ? m[2] : '', body: body };
  });
  dRender();
}
async function dCommit(cmsg) {
  try {
    D.sha = await ghPut('daily.md', D.sha, dSerialize(), cmsg);
    ok('已保存！约 1 分钟后可见 → <a href="daily.html">查看日常页</a>');
    dCancel(); dRender();
  } catch (e) { err(e.message); dLoad(); }
}
function dCancel() {
  D.edit = -1; $('dBody').value = '';
  $('dFormTitle').textContent = '新增日常'; $('dSave').textContent = '发布'; $('dCancelBox').style.display = 'none';
}
$('dCancel').onclick = dCancel;
$('dSave').onclick = function () {
  var date = $('dDate').value, slot = $('dSlot').value, body = $('dBody').value.trim();
  if (!date || !body) { err('日期和内容都要填'); return; }
  if (D.edit === -1) { D.entries.unshift({ date: date, slot: slot, body: body }); dCommit('daily: 新增 ' + date); }
  else { D.entries[D.edit] = { date: date, slot: slot, body: body }; dCommit('daily: 编辑 ' + date); }
};

/* ═══════ 书单 ═══════ */
var B = { sha: '', stages: [], books: [], edit: -1 };
var B_STATUS = { reading: '在读', todo: '待读', free: '免费在线', done: '已读' };
function bRender() {
  $('bCnt').textContent = B.books.length;
  $('bList').innerHTML = '';
  B.books.forEach(function (b, i) {
    var div = document.createElement('div'); div.className = 'entry';
    div.innerHTML = '<div class="k"></div><div class="v"></div><div class="ops"></div>';
    var st = B.stages[b.stage] || {};
    div.querySelector('.k').textContent = (st.name || '') + ' · ' + (B_STATUS[b.status] || b.status);
    div.querySelector('.v').textContent = '《' + b.title + '》 ' + (b.author || '');
    var be = document.createElement('button'); be.className = 'btn btn-ghost'; be.textContent = '编辑';
    be.onclick = function () {
      B.edit = i; $('bTitle').value = b.title; $('bStage').value = b.stage; $('bStatus').value = b.status;
      $('bAuthor').value = b.author || ''; $('bLink').value = b.link || '';
      $('bFormTitle').textContent = '编辑书籍'; $('bSave').textContent = '保存修改'; $('bCancelBox').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    var bd = document.createElement('button'); bd.className = 'btn btn-ghost btn-danger'; bd.textContent = '删除';
    bd.onclick = async function () {
      if (!confirm('删除《' + b.title + '》？')) return;
      B.books.splice(i, 1); await bCommit('books: 删除 ' + b.title);
    };
    div.querySelector('.ops').appendChild(be); div.querySelector('.ops').appendChild(bd);
    $('bList').appendChild(div);
  });
}
async function bLoad() {
  var g = await ghGet('books.json'); B.sha = g.sha;
  var d = JSON.parse(g.text);
  B.stages = d.stages; B.books = d.books;
  $('bStage').innerHTML = B.stages.map(function (s, i) { return '<option value="' + i + '">' + s.no + ' ' + s.name + '</option>'; }).join('');
  bRender();
}
async function bCommit(cmsg) {
  try {
    B.sha = await ghPut('books.json', B.sha, JSON.stringify({ stages: B.stages, books: B.books }, null, 2), cmsg);
    ok('已保存！约 1 分钟后可见 → <a href="books.html">查看书单页</a>');
    bCancel(); bRender();
  } catch (e) { err(e.message); bLoad(); }
}
function bCancel() {
  B.edit = -1; $('bTitle').value = ''; $('bAuthor').value = ''; $('bLink').value = '';
  $('bFormTitle').textContent = '新增书籍'; $('bSave').textContent = '保存'; $('bCancelBox').style.display = 'none';
}
$('bCancel').onclick = bCancel;
$('bSave').onclick = function () {
  var b = {
    title: $('bTitle').value.trim(), stage: parseInt($('bStage').value, 10),
    status: $('bStatus').value, author: $('bAuthor').value.trim(), link: $('bLink').value.trim()
  };
  if (!b.title) { err('书名必填'); return; }
  if (B.edit === -1) { B.books.unshift(b); bCommit('books: 新增 ' + b.title); }
  else { B.books[B.edit] = b; bCommit('books: 编辑 ' + b.title); }
};

/* ═══════ 工具 ═══════ */
var T = { sha: '', posts: [], edit: -1 };
function tRender() {
  $('tCnt').textContent = T.posts.length;
  $('tList').innerHTML = '';
  T.posts.forEach(function (p, i) {
    var div = document.createElement('div'); div.className = 'entry';
    div.innerHTML = '<div class="k"></div><div class="v"></div><div class="ops"></div>';
    div.querySelector('.k').textContent = p.cat + (p.tag ? ' · ' + p.tag : '');
    div.querySelector('.v').textContent = p.title;
    var be = document.createElement('button'); be.className = 'btn btn-ghost'; be.textContent = '编辑';
    be.onclick = function () {
      T.edit = i; $('tTitle').value = p.title; $('tCat').value = p.cat; $('tTag').value = p.tag || ''; $('tBody').value = p.body;
      $('tFormTitle').textContent = '编辑工具帖'; $('tSave').textContent = '保存修改'; $('tCancelBox').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    var bd = document.createElement('button'); bd.className = 'btn btn-ghost btn-danger'; bd.textContent = '删除';
    bd.onclick = async function () {
      if (!confirm('删除「' + p.title + '」？')) return;
      T.posts.splice(i, 1); await tCommit('tools: 删除 ' + p.title);
    };
    div.querySelector('.ops').appendChild(be); div.querySelector('.ops').appendChild(bd);
    $('tList').appendChild(div);
  });
}
async function tLoad() {
  var g = await ghGet('tools.json'); T.sha = g.sha;
  T.posts = JSON.parse(g.text).posts;
  tRender();
}
async function tCommit(cmsg) {
  try {
    T.sha = await ghPut('tools.json', T.sha, JSON.stringify({ posts: T.posts }, null, 2), cmsg);
    ok('已保存！约 1 分钟后可见 → <a href="tools.html">查看工具页</a>');
    tCancel(); tRender();
  } catch (e) { err(e.message); tLoad(); }
}
function tCancel() {
  T.edit = -1; $('tTitle').value = ''; $('tBody').value = '';
  $('tFormTitle').textContent = '新增工具帖'; $('tSave').textContent = '保存'; $('tCancelBox').style.display = 'none';
}
$('tCancel').onclick = tCancel;
$('tSave').onclick = function () {
  var p = {
    title: $('tTitle').value.trim(), cat: $('tCat').value.trim() || '未分类',
    tag: $('tTag').value.trim(), body: $('tBody').value.trim()
  };
  if (!p.title || !p.body) { err('标题和正文必填'); return; }
  if (T.edit === -1) { T.posts.unshift(p); tCommit('tools: 新增 ' + p.title); }
  else { T.posts[T.edit] = p; tCommit('tools: 编辑 ' + p.title); }
};

/* ═══════ 启动 ═══════ */
if (token) boot(); else $('tokenBox').style.display = 'block';
$('saveToken').onclick = function () {
  var t = $('tokenInput').value.trim();
  if (!t) return;
  localStorage.setItem('gh_pat', t); token = t; boot();
};
async function boot() {
  $('tokenBox').style.display = 'none';
  $('mainBox').style.display = 'block';
  try { await Promise.all([dLoad(), bLoad(), tLoad()]); }
  catch (e) { err('加载失败：' + e.message); }
}
</script>
</body>
</html>
