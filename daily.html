<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常 · 0xL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
:root { --bg:#fdfbf9; --card:#fff; --border:#f0e8e4; --text:#3a3a44; --dim:#9c96a3; --pink:#f08fb7; --pink-deep:#e56aa0; --shadow:0 6px 24px rgba(229,106,160,.08); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:"LXGW WenKai","PingFang SC","Microsoft YaHei",sans-serif; }
.wrap { max-width:700px; margin:0 auto; padding:0 24px; }
nav { position:sticky; top:14px; z-index:100; max-width:660px; margin:14px auto 0;
  background:rgba(255,255,255,.75); backdrop-filter:blur(14px);
  border:1px solid var(--border); border-radius:999px; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between; padding:8px 10px 8px 14px; }
.nav-avatar { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; }
.nav-avatar img { width:34px; height:34px; border-radius:50%; object-fit:cover; border:2px solid rgba(240,143,183,.4); filter:brightness(1.3); }
nav .links a { color:var(--dim); text-decoration:none; font-size:14px; padding:8px 12px; border-radius:999px; transition:all .2s; }
nav .links a:hover { color:var(--pink-deep); background:rgba(240,143,183,.1); }
nav .links a.on { color:var(--pink-deep); background:rgba(240,143,183,.12); }
h1.page { font-size:26px; margin:42px 0 8px; }
.sub { color:var(--dim); font-size:14px; margin-bottom:34px; }
.tl { position:relative; padding-left:26px; }
.tl::before { content:""; position:absolute; left:7px; top:6px; bottom:6px; width:2px; background:linear-gradient(var(--pink), rgba(240,143,183,.1)); border-radius:2px; }
.day { position:relative; margin-bottom:26px; }
.day::before { content:""; position:absolute; left:-25px; top:7px; width:12px; height:12px; border-radius:50%; background:#fff; border:3px solid var(--pink); }
.day .when { font-size:12px; color:var(--dim); font-family:Consolas,monospace; margin-bottom:6px; }
.day .what { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 18px; box-shadow:var(--shadow); font-size:15px; line-height:1.8; transition:all .25s; }
.day .what:hover { transform:translateX(4px); border-color:rgba(240,143,183,.4); }
footer { text-align:center; padding:44px 0 36px; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
<nav>
  <div class="nav-avatar"><img src="avatar.png" alt="头像">0xL</div>
  <div class="links"><a href="index.html">首页</a><a href="notes.html">知识库</a><a href="shizhan.html">实战</a><a href="projects.html">项目</a><a href="books.html">书单</a><a href="daily.html" class="on">日常</a><a href="letters.html">留言</a></div>
</nav>

<h1 class="page">日常</h1>
<div class="sub">不成文的碎片记录：今天做了什么、想了什么。</div>

<div class="tl" id="tl"></div>

<footer>© 2026 0xL · Stay curious, stay reverse.</footer>
</div>
<script>
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
fetch('daily.md').then(function (r) { return r.text(); }).then(function (md) {
  var blocks = md.split(/^## /m).slice(1);
  var html = '';
  blocks.forEach(function (b) {
    var nl = b.indexOf('\n');
    var when = b.slice(0, nl).trim();
    var what = b.slice(nl).trim();
    if (!when || !what) return;
    html += '<div class="day"><div class="when">' + esc(when) + '</div><div class="what">' + esc(what) + '</div></div>';
  });
  document.getElementById('tl').innerHTML = html || '<div class="day"><div class="what">还没有日常，去 daily.md 写第一条吧。</div></div>';
}).catch(function () {
  document.getElementById('tl').innerHTML = '<div class="day"><div class="what">daily.md 加载失败。</div></div>';
});
</script>
</body>
</html>
