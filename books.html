<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书单 · 0xL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
:root { --bg:#fdfbf9; --card:#fff; --border:#f0e8e4; --text:#3a3a44; --dim:#9c96a3; --pink:#f08fb7; --pink-deep:#e56aa0; --shadow:0 6px 24px rgba(229,106,160,.08); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:"LXGW WenKai","PingFang SC","Microsoft YaHei",sans-serif; }
.wrap { max-width:760px; margin:0 auto; padding:0 24px; }
nav { position:sticky; top:14px; z-index:100; max-width:700px; margin:14px auto 0;
  background:rgba(255,255,255,.75); backdrop-filter:blur(14px);
  border:1px solid var(--border); border-radius:999px; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between; padding:8px 10px 8px 14px; }
.nav-avatar { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; }
.nav-avatar img { width:34px; height:34px; border-radius:50%; object-fit:cover; border:2px solid rgba(240,143,183,.4); filter:brightness(1.3); }
nav .links a { color:var(--dim); text-decoration:none; font-size:14px; padding:8px 11px; border-radius:999px; transition:all .2s; }
nav .links a:hover { color:var(--pink-deep); background:rgba(240,143,183,.1); }
nav .links a.on { color:var(--pink-deep); background:rgba(240,143,183,.12); }
h1.page { font-size:26px; margin:42px 0 8px; }
.sub { color:var(--dim); font-size:14px; margin-bottom:26px; }
.book { display:flex; align-items:center; gap:14px;
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:14px 18px; margin-bottom:10px; box-shadow:var(--shadow); transition:all .25s; }
.book:hover { transform:translateX(4px); border-color:rgba(240,143,183,.4); }
.book .t { font-size:15px; font-weight:600; }
.book .t a { color:inherit; text-decoration:none; }
.book .t a:hover { color:var(--pink-deep); text-decoration:underline; }
.book .a { color:var(--dim); font-size:12px; margin-top:2px; }
.book .st { margin-left:auto; font-size:11px; padding:3px 11px; border-radius:999px; white-space:nowrap; }
.st.reading { color:var(--pink-deep); background:rgba(240,143,183,.12); border:1px solid rgba(240,143,183,.4); }
.st.todo { color:var(--dim); background:rgba(156,150,163,.08); border:1px solid rgba(156,150,163,.25); }
.st.free, .st.done { color:#3d8b5f; background:rgba(123,199,150,.14); border:1px solid rgba(123,199,150,.4); }
footer { text-align:center; padding:44px 0 36px; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
<nav>
  <div class="nav-avatar"><img src="avatar.png" alt="头像">0xL</div>
  <div class="links"><a href="index.html">首页</a><a href="notes.html">知识库</a><a href="shizhan.html">实战</a><a href="projects.html">项目</a><a href="books.html" class="on">书单</a><a href="tools.html">工具</a><a href="daily.html">日常</a></div>
</nav>

<h1 class="page">书单</h1>
<div class="sub">通往二进制漏洞研究的路。</div>
<div id="list"></div>
<footer>© 2026 0xL · Stay curious, stay reverse.</footer>
</div>
<script>
var STATUS = { reading: '在读', todo: '待读', free: '免费在线', done: '已读' };
fetch('books.json?v=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
  var box = document.getElementById('list');
  d.books.forEach(function (b) {
    var div = document.createElement('div'); div.className = 'book';
    var info = document.createElement('div');
    var t = document.createElement('div'); t.className = 't';
    if (b.link) {
      var a = document.createElement('a'); a.href = b.link; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '《' + b.title + '》↗'; t.appendChild(a);
    } else { t.textContent = '《' + b.title + '》'; }
    var au = document.createElement('div'); au.className = 'a'; au.textContent = b.author || '';
    info.appendChild(t); info.appendChild(au);
    var st = document.createElement('span'); st.className = 'st ' + b.status; st.textContent = STATUS[b.status] || b.status;
    div.appendChild(info); div.appendChild(st);
    box.appendChild(div);
  });
});
</script>
</body>
</html>
