<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目 · 0xL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
:root { --bg:#fdfbf9; --card:#fff; --border:#f0e8e4; --text:#3a3a44; --dim:#9c96a3; --pink:#f08fb7; --pink-deep:#e56aa0; --blue:#8ec5e8; --shadow:0 6px 24px rgba(229,106,160,.08); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:"LXGW WenKai","PingFang SC","Microsoft YaHei",sans-serif; }
.wrap { max-width:760px; margin:0 auto; padding:0 24px; }
nav { position:sticky; top:14px; z-index:100; max-width:700px; margin:14px auto 0;
  background:rgba(255,255,255,.75); backdrop-filter:blur(14px);
  border:1px solid var(--border); border-radius:999px; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between; padding:8px 10px 8px 14px; }
.nav-avatar { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; }
.nav-avatar img { width:34px; height:34px; border-radius:50%; object-fit:cover; border:2px solid rgba(240,143,183,.4); filter:brightness(1.3); }
nav .links a { color:var(--dim); text-decoration:none; font-size:14px; padding:8px 11px; border-radius:999px; transition:all .2s; }
nav .links a:hover { color:var(--pink-deep); background:rgba(240,143,183,.1); }
nav .links a.on { color:var(--pink-deep); background:rgba(240,143,183,.12); }
h1.page { font-size:26px; margin:42px 0 8px; }
.sub { color:var(--dim); font-size:14px; margin-bottom:26px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:620px) { .grid { grid-template-columns:1fr; } }
.card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:22px; box-shadow:var(--shadow); transition:all .25s; }
.card:hover { transform:translateY(-4px); border-color:rgba(142,197,232,.6); box-shadow:0 12px 32px rgba(142,197,232,.18); }
.card .ico { font-size:24px; margin-bottom:12px; }
.card h3 { font-size:16px; margin-bottom:8px; }
.card p { font-size:13px; color:var(--dim); line-height:1.75; }
.card .st { font-size:11px; padding:2px 10px; border-radius:999px; margin-left:8px; vertical-align:2px; }
.st.done { color:#3d8b5f; background:rgba(123,199,150,.14); }
.st.wip { color:var(--pink-deep); background:rgba(240,143,183,.12); }
.st.plan { color:var(--dim); background:rgba(156,150,163,.1); }
footer { text-align:center; padding:44px 0 36px; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
<nav>
  <div class="nav-avatar"><img src="avatar.png" alt="头像">0xL</div>
  <div class="links"><a href="index.html">首页</a><a href="notes.html">知识库</a><a href="shizhan.html">实战</a><a href="projects.html" class="on">项目</a><a href="books.html">书单</a><a href="tools.html">工具</a><a href="daily.html">日常</a></div>
</nav>

<h1 class="page">项目</h1>
<div class="sub">造过的东西。完成度从绿到灰。</div>
<div class="grid" id="grid"></div>
<footer>© 2026 0xL · Stay curious, stay reverse.</footer>
</div>
<script>
var CLS = { '已完成': 'done', '开发中': 'wip', '规划中': 'plan', '已归档': 'plan' };
fetch('projects.json?v=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
  var box = document.getElementById('grid');
  d.projects.forEach(function (p) {
    var c = document.createElement('div'); c.className = 'card';
    var ico = document.createElement('div'); ico.className = 'ico'; ico.textContent = p.icon || '📦';
    var h = document.createElement('h3'); h.textContent = p.name;
    var st = document.createElement('span'); st.className = 'st ' + (CLS[p.status] || 'plan'); st.textContent = p.status;
    h.appendChild(st);
    var desc = document.createElement('p'); desc.textContent = p.desc;
    c.appendChild(ico); c.appendChild(h); c.appendChild(desc);
    box.appendChild(c);
  });
});
</script>
</body>
</html>
