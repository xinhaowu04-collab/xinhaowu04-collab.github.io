<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库 · 0xL</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
window.MathJax = { tex: { displayMath: [['$$', '$$']], inlineMath: [] }, options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
:root { --bg:#fdfbf9; --card:#fff; --border:#f0e8e4; --text:#3a3a44; --dim:#9c96a3; --pink:#f08fb7; --pink-deep:#e56aa0; --shadow:0 6px 24px rgba(229,106,160,.08); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:"LXGW WenKai","PingFang SC","Microsoft YaHei",sans-serif; }
.wrap { max-width:760px; margin:0 auto; padding:0 24px; }
nav { position:sticky; top:14px; z-index:100; max-width:700px; margin:14px auto 0;
  background:rgba(255,255,255,.75); backdrop-filter:blur(14px);
  border:1px solid var(--border); border-radius:999px; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between; padding:8px 10px 8px 14px; }
.nav-avatar { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; }
.nav-avatar img { width:34px; height:34px; border-radius:50%; object-fit:cover; border:2px solid rgba(240,143,183,.4); filter:brightness(1.3); }
nav .links a { color:var(--dim); text-decoration:none; font-size:14px; padding:8px 11px; border-radius:999px; transition:all .2s; }
nav .links a:hover { color:var(--pink-deep); background:rgba(240,143,183,.1); }
nav .links a.on { color:var(--pink-deep); background:rgba(240,143,183,.12); }
h1.page { font-size:26px; margin:42px 0 8px; }
.sub { color:var(--dim); font-size:14px; margin-bottom:20px; }
.search { width:100%; margin-bottom:26px; padding:12px 18px; font-size:14px; font-family:inherit; color:var(--text);
  background:var(--card); border:1px solid var(--border); border-radius:999px; box-shadow:var(--shadow); outline:none; }
.search:focus { border-color:rgba(240,143,183,.5); }
details.cat { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden; }
details.cat summary { list-style:none; padding:16px 20px; display:flex; align-items:center; gap:10px;
  font-size:15px; font-weight:700; user-select:none; }
details.cat summary::-webkit-details-marker { display:none; }
details.cat summary:hover { background:rgba(240,143,183,.05); }
details.cat summary .arrow { color:var(--pink-deep); font-size:12px; transition:transform .25s; }
details.cat[open] summary .arrow { transform:rotate(90deg); }
details.cat summary .cnt { margin-left:auto; color:var(--dim); font-size:12px; font-weight:400; font-family:Consolas,monospace; }
details.cat .items { padding:4px 12px 14px; }
.post { display:flex; justify-content:space-between; align-items:center; gap:14px; border-radius:12px; padding:11px 14px; color:var(--text); cursor:pointer; transition:background .2s; }
.post:hover { background:rgba(240,143,183,.07); }
.post .t { font-size:14px; font-weight:600; }
.post .d { color:var(--dim); font-size:12px; font-family:Consolas,monospace; white-space:nowrap; }
/* 阅读卡 */
.reader { display:none; background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:30px 34px; margin-bottom:26px; }
.reader h2 { font-size:22px; margin-bottom:6px; }
.reader .rmeta { color:var(--dim); font-size:12px; margin-bottom:18px; font-family:Consolas,monospace; }
.reader .rbody { font-size:15px; line-height:1.95; }
.reader .rbody h1, .reader .rbody h2, .reader .rbody h3 { margin:22px 0 10px; }
.reader .rbody pre { background:#2d2a2e; color:#f8f8f2; border-radius:12px; padding:16px 18px; overflow-x:auto; font-size:13px; line-height:1.7; }
.reader .rbody code { font-family:Consolas,monospace; }
.reader .rbody p code, .reader .rbody li code { background:rgba(240,143,183,.12); color:var(--pink-deep); padding:2px 7px; border-radius:6px; font-size:13px; }
.reader .rbody pre code { background:none; color:inherit; padding:0; }
.reader .rbody table { border-collapse:collapse; width:100%; margin:12px 0; font-size:14px; }
.reader .rbody th, .reader .rbody td { border:1px solid var(--border); padding:8px 12px; text-align:left; }
.reader .rbody img { max-width:100%; border-radius:12px; }
.reader .rbody blockquote { border-left:3px solid var(--pink); padding-left:14px; color:var(--dim); margin:10px 0; }
.reader .rbody a { color:var(--pink-deep); word-break:break-all; }
.reader .close { display:inline-block; margin-top:18px; font-size:13px; color:var(--pink-deep); cursor:pointer; }
footer { text-align:center; padding:44px 0 36px; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
<nav>
  <div class="nav-avatar"><img src="avatar.png" alt="头像">0xL</div>
  <div class="links"><a href="index.html">首页</a><a href="notes.html" class="on">知识库</a><a href="shizhan.html">实战</a><a href="projects.html">项目</a><a href="books.html">书单</a><a href="tools.html">工具</a><a href="daily.html">日常</a></div>
</nav>

<h1 class="page">知识库</h1>
<div class="sub">课堂沉淀在这里。</div>

<div class="reader" id="reader">
  <h2 id="rTitle"></h2>
  <div class="rmeta" id="rMeta"></div>
  <div class="rbody" id="rBody"></div>
  <span class="close" id="rClose">← 返回列表</span>
</div>

<input class="search" id="q" placeholder="搜索知识库…">
<div id="cats"></div>
<footer>© 2026 0xL · Stay curious, stay reverse.</footer>
</div>
<script>
var POSTS = [];
fetch('notes.json?v=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
  POSTS = d.posts;
  render();
  if (location.hash) openBySlug(decodeURIComponent(location.hash.slice(1)));
});
function render() {
  var cats = {};
  var order = [];
  POSTS.forEach(function (p, i) {
    if (!cats[p.cat]) { cats[p.cat] = []; order.push(p.cat); }
    cats[p.cat].push(i);
  });
  var box = document.getElementById('cats');
  order.forEach(function (cat, ci) {
    var det = document.createElement('details'); det.className = 'cat'; if (ci === 0) det.open = true;
    var sum = document.createElement('summary');
    sum.innerHTML = '<span class="arrow">▶</span>';
    sum.appendChild(document.createTextNode(cat));
    var cnt = document.createElement('span'); cnt.className = 'cnt'; cnt.textContent = cats[cat].length + ' 篇';
    sum.appendChild(cnt);
    var items = document.createElement('div'); items.className = 'items';
    cats[cat].forEach(function (i, n) {
      var p = POSTS[i];
      var a = document.createElement('div'); a.className = 'post';
      var t = document.createElement('span'); t.className = 't'; t.textContent = p.title;
      var d2 = document.createElement('span'); d2.className = 'd'; d2.textContent = String(n + 1).padStart(2, '0');
      a.appendChild(t); a.appendChild(d2);
      a.onclick = function () { openPost(i); };
      items.appendChild(a);
    });
    det.appendChild(sum); det.appendChild(items);
    box.appendChild(det);
  });
}
function openBySlug(slug) {
  for (var i = 0; i < POSTS.length; i++) {
    if (POSTS[i].slug === slug) { openPost(i); return; }
  }
}
function openPost(i) {
  var p = POSTS[i];
  document.getElementById('rTitle').textContent = p.title;
  document.getElementById('rMeta').textContent = p.cat + ' · ' + p.slug;
  document.getElementById('rBody').innerHTML = marked.parse(p.body);
  document.getElementById('reader').style.display = 'block';
  history.replaceState(null, '', '#' + encodeURIComponent(p.slug));
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.getElementById('rClose').onclick = function () {
  document.getElementById('reader').style.display = 'none';
  history.replaceState(null, '', location.pathname);
};
document.getElementById('q').addEventListener('input', function () {
  var k = this.value.trim();
  document.querySelectorAll('.post').forEach(function (p) {
    p.style.display = !k || p.textContent.indexOf(k) !== -1 ? '' : 'none';
  });
  document.querySelectorAll('details.cat').forEach(function (c) {
    var any = false;
    c.querySelectorAll('.post').forEach(function (p) { if (p.style.display !== 'none') any = true; });
    c.style.display = any ? '' : 'none';
    if (k) c.open = true;
  });
});
</script>
</body>
</html>
