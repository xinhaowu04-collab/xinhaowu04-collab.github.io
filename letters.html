<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
:root { --bg:#fdfbf9; --card:#fff; --border:#f0e8e4; --text:#3a3a44; --dim:#9c96a3; --pink:#f08fb7; --pink-deep:#e56aa0; --shadow:0 6px 24px rgba(229,106,160,.08); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:"LXGW WenKai","PingFang SC","Microsoft YaHei",sans-serif; }
.wrap { max-width:760px; margin:0 auto; padding:0 24px; }
nav { position:sticky; top:14px; z-index:100; max-width:660px; margin:14px auto 0;
  background:rgba(255,255,255,.75); backdrop-filter:blur(14px);
  border:1px solid var(--border); border-radius:999px; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between; padding:8px 10px 8px 14px; }
.nav-avatar { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; }
.nav-avatar img { width:34px; height:34px; border-radius:50%; object-fit:cover; border:2px solid rgba(240,143,183,.4); filter:brightness(1.3); }
nav .links a { color:var(--dim); text-decoration:none; font-size:14px; padding:8px 12px; border-radius:999px; transition:all .2s; }
nav .links a:hover { color:var(--pink-deep); background:rgba(240,143,183,.1); }
nav .links a.on { color:var(--pink-deep); background:rgba(240,143,183,.12); }
h1.page { font-size:26px; margin:42px 0 8px; }
.sub { color:var(--dim); font-size:14px; margin-bottom:24px; }
.welcome { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow);
  padding:20px 24px; margin-bottom:26px; font-size:14px; line-height:2; }
.welcome em { font-style:normal; color:var(--pink-deep); }
.comments { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:10px 18px; }
footer { text-align:center; padding:44px 0 36px; color:var(--dim); font-size:13px; }
* { cursor:none !important; }
#cursor-ring { display:none !important; }
#cursor-dot { position:fixed; z-index:9999; width:30px; height:30px; pointer-events:none;
  background:url("penguin.png") center/contain no-repeat;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.15));
  animation:penguin-wob 2.2s ease-in-out infinite; }
#cursor-dot.hov { animation:penguin-wob .45s ease-in-out infinite; }
@keyframes penguin-wob { 0%,100% { transform:translate(-50%,-60%) rotate(-8deg) } 50% { transform:translate(-50%,-60%) rotate(8deg) } }
@media (hover:none) { #cursor-dot,#cursor-ring { display:none } body { cursor:auto } }
</style>

        repo="xinhaowu04-collab/xinhaowu04-collab.github.io"

</div>

<footer>© 2026 0xL · Stay curious, stay reverse.</footer>
</div>
<script>
var dot = document.getElementById('cursor-dot'), mx = -100, my = -100;
document.addEventListener('mousemove', function (e) { mx = e.clientX; my = e.clientY; });
(function loop() { dot.style.left = mx + 'px'; dot.style.top = my + 'px'; requestAnimationFrame(loop); })();
document.querySelectorAll('a').forEach(function (el) {
  el.addEventListener('mouseenter', function () { dot.classList.add('hov'); });
  el.addEventListener('mouseleave', function () { dot.classList.remove('hov'); });
});
</script>
</body>
